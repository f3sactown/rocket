name: Back up database

# Every night, dump the production Supabase database (roles, schema and data, including the users in
# auth.users) with `supabase db dump`, encrypt it with a passphrase and upload it with rclone to the
# "Rocket backups" folder in Google Drive, deleting backups older than 90 days. Nothing is kept on
# GitHub. See "Backups" in the README to set it up and to restore one.
on:
  schedule:
    # 09:43 UTC is about 2am Pacific, before the region sync.
    - cron: "43 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check settings
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          fail() { echo "::error::$1 (Settings → Secrets and variables → Actions)"; exit 1; }
          [ -n "$SUPABASE_DB_URL" ] || fail "Set the SUPABASE_DB_URL repository secret."
          [ ${#BACKUP_PASSPHRASE} -ge 20 ] || fail "Set a BACKUP_PASSPHRASE secret of at least 20 characters."
          for s in GDRIVE_CLIENT_ID GDRIVE_CLIENT_SECRET GDRIVE_TOKEN; do
            [ -n "${!s}" ] || fail "Set the $s repository secret."
          done
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `supabase db dump` runs pg_dump in Docker, which the runner has.
      - name: Dump the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup
          pnpm exec supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f backup/roles.sql
          pnpm exec supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          pnpm exec supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f backup/data.sql
          for f in roles schema data; do
            [ -s "backup/$f.sql" ] || { echo "::error::backup/$f.sql is empty."; exit 1; }
          done
          ls -l backup
      - name: Encrypt
        id: encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="rocket-db-$(date -u +%F)"
          tar -czf - -C backup roles.sql schema.sql data.sql |
            gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
              --passphrase-fd 3 -o "$name.tar.gz.gpg" 3<<<"$BACKUP_PASSPHRASE"
          rm -rf backup
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Upload to Google Drive
        env:
          # A Drive remote named "gdrive", set up from secrets instead of a config file.
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          FILE: ${{ steps.encrypt.outputs.name }}.tar.gz.gpg
        run: |
          rclone copy "$FILE" "gdrive:Rocket backups" --config /dev/null
          rclone lsl "gdrive:Rocket backups" --config /dev/null --include "$FILE" | grep -q . ||
            { echo "::error::$FILE isn't in Google Drive after the upload."; exit 1; }
          rm -f "$FILE"
          # Old backups go to Drive's trash, which empties itself after 30 days.
          rclone delete "gdrive:Rocket backups" --config /dev/null --min-age 90d --include "rocket-db-*" -v
