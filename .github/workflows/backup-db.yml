name: Back up database

# Every night, dump the production Supabase database (roles, schema and data, including the users in
# auth.users) with `supabase db dump`, encrypt it with a passphrase and keep it as a workflow
# artifact for 90 days. Artifacts on a public repository can be downloaded by anyone signed in to
# GitHub, so the dump is only ever stored encrypted. See "Backups" in the README to restore one.
on:
  schedule:
    # 09:43 UTC is about 2am Pacific, before the region sync.
    - cron: "43 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check settings
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          fail() { echo "::error::$1 (Settings → Secrets and variables → Actions)"; exit 1; }
          [ -n "$SUPABASE_DB_URL" ] || fail "Set the SUPABASE_DB_URL repository secret."
          [ ${#BACKUP_PASSPHRASE} -ge 20 ] || fail "Set a BACKUP_PASSPHRASE secret of at least 20 characters."
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `supabase db dump` runs pg_dump in Docker, which the runner has.
      - name: Dump the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup
          pnpm exec supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f backup/roles.sql
          pnpm exec supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          pnpm exec supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f backup/data.sql
          for f in roles schema data; do
            [ -s "backup/$f.sql" ] || { echo "::error::backup/$f.sql is empty."; exit 1; }
          done
          ls -l backup
      - name: Encrypt
        id: encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="rocket-db-$(date -u +%F)"
          tar -czf - -C backup roles.sql schema.sql data.sql |
            gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
              --passphrase-fd 3 -o "$name.tar.gz.gpg" 3<<<"$BACKUP_PASSPHRASE"
          rm -rf backup
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.encrypt.outputs.name }}
          path: ${{ steps.encrypt.outputs.name }}.tar.gz.gpg
          retention-days: 90
          # Already compressed and encrypted.
          compression-level: 0
          if-no-files-found: error
