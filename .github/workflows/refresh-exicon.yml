name: Refresh Exicon library

# Weekly: download the F3 Exicon (https://codex.f3nation.com/exicon) and the FiA
# Lexicon/Exicon Google Sheet, rebuild data/library.js, and commit it when either
# changed. Run it any time from the Actions tab.
on:
  schedule:
    - cron: "17 11 * * 1"   # Mondays 11:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-exicon
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Each source downloads on its own, so one failing still lets the other update;
      # a failed download still marks the run as failed.
      - name: Download the F3 Exicon
        id: f3
        continue-on-error: true
        run: python3 tools/fetch_exicon.py

      - name: Download the FiA Lexicon/Exicon
        id: fia
        continue-on-error: true
        run: python3 tools/fetch_fia.py

      - name: Rebuild the library if a source changed
        id: build
        run: |
          git add -N source/fia-lexicon.csv 2>/dev/null || true
          if git diff --quiet -- source/exicon-export.csv source/fia-lexicon.csv; then
            echo "Sources unchanged; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            python3 tools/build_library.py
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/exicon-export.csv data/library.js
          [ -f source/fia-lexicon.csv ] && git add source/fia-lexicon.csv
          count=$(python3 -c "import re;print(re.search(r'\"count\":(\d+)',open('data/library.js').read()).group(1))")
          git commit -m "Refresh Exicon library ($count entries)"
          git push

      - name: Fail the run if a download failed
        if: steps.f3.outcome == 'failure' || steps.fia.outcome == 'failure'
        run: |
          echo "F3 Exicon download: ${{ steps.f3.outcome }} · FiA download: ${{ steps.fia.outcome }}"
          exit 1
