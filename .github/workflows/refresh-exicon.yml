name: Refresh Exicon library

# Weekly: download the F3 Exicon (https://codex.f3nation.com/exicon), the FiA
# Lexicon/Exicon Google Sheet, and the PAX roster and attendance from the F3 SacTown
# Data sheet; rebuild data/library.js, data/roster.js and data/attendance.js, and
# commit whatever changed. Run it any time from the Actions tab.
on:
  push:
    branches: [claude/dazzling-planck-w5rkzz]   # TEMPORARY: first totals download; removed before merge
  schedule:
    - cron: "17 11 * * 1"   # Mondays 11:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-exicon
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Each source downloads on its own, so one failing still lets the other update;
      # a failed download still marks the run as failed.
      - name: Download the F3 Exicon
        id: f3
        continue-on-error: true
        run: python3 tools/fetch_exicon.py

      - name: Download the FiA Lexicon/Exicon
        id: fia
        continue-on-error: true
        run: python3 tools/fetch_fia.py

      - name: Download the PAX roster
        id: roster
        continue-on-error: true
        run: python3 tools/fetch_roster.py

      - name: Download recent attendance
        id: attendance
        continue-on-error: true
        run: python3 tools/fetch_attendance.py

      - name: Rebuild the library if a source changed
        id: build
        run: |
          git add -N source/fia-lexicon.csv 2>/dev/null || true
          if git diff --quiet -- source/exicon-export.csv source/fia-lexicon.csv; then
            echo "Library sources unchanged."
          else
            python3 tools/build_library.py
          fi
          git add -N data/roster.js data/attendance.js 2>/dev/null || true
          if git diff --quiet -- data/library.js data/roster.js data/attendance.js source/; then
            echo "Nothing changed; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/ data/library.js
          for f in data/roster.js data/attendance.js; do [ -f "$f" ] && git add "$f"; done
          count=$(python3 -c "import re;print(re.search(r'\"count\":(\d+)',open('data/library.js').read()).group(1))")
          pax=$(python3 -c "import re,os;print(re.search(r'\"count\": ?(\d+)',open('data/roster.js').read()).group(1) if os.path.exists('data/roster.js') else 0)")
          git commit -m "Refresh Exicon library ($count entries), PAX roster ($pax names) and attendance"
          git push

      - name: Fail the run if a download failed
        if: steps.f3.outcome == 'failure' || steps.fia.outcome == 'failure' || steps.roster.outcome == 'failure' || steps.attendance.outcome == 'failure'
        run: |
          echo "F3 Exicon: ${{ steps.f3.outcome }} · FiA: ${{ steps.fia.outcome }} · Roster: ${{ steps.roster.outcome }} · Attendance: ${{ steps.attendance.outcome }}"
          exit 1
