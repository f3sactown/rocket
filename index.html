<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Plan F3 workouts, write backblasts, and browse the F3 Nation Exicon.">
  <title>F3 Q Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Splash: rocket launch while the app loads. Tap to skip. -->
  <div id="splash" class="splash" role="img" aria-label="Rocket launching">
    <div class="sp-stars" aria-hidden="true">
      <i style="left:12%;top:14%"></i><i style="left:28%;top:32%"></i><i style="left:44%;top:9%"></i>
      <i style="left:63%;top:24%"></i><i style="left:81%;top:12%"></i><i style="left:90%;top:38%"></i>
      <i style="left:7%;top:46%"></i><i style="left:35%;top:55%"></i><i style="left:72%;top:50%"></i>
      <i style="left:55%;top:40%"></i><i style="left:20%;top:66%"></i><i style="left:86%;top:62%"></i>
    </div>
    <div class="sp-stage">
      <svg class="sp-svg" viewBox="0 0 200 320" aria-hidden="true">
        <defs>
          <linearGradient id="spFlame" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset=".35" stop-color="#cfe6f7"/>
            <stop offset=".7" stop-color="#8cc8f2"/>
            <stop offset="1" stop-color="#8cc8f2" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="spTrail" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8cc8f2" stop-opacity=".55"/>
            <stop offset="1" stop-color="#8cc8f2" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="spBody" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#c5ccd4"/>
            <stop offset=".45" stop-color="#f4f5f7"/>
            <stop offset="1" stop-color="#9aa3ad"/>
          </linearGradient>
        </defs>
        <!-- launch pad -->
        <g class="sp-pad">
          <rect x="40" y="262" width="120" height="6" rx="3" fill="#23262b"/>
          <rect x="58" y="268" width="6" height="30" fill="#16191d"/>
          <rect x="136" y="268" width="6" height="30" fill="#16191d"/>
        </g>
      </svg>
      <svg class="sp-svg sp-rocket-layer" viewBox="0 0 200 320" aria-hidden="true">
        <!-- rocket -->
        <g class="sp-rocket">
          <rect class="sp-trail" x="88" y="226" width="24" height="420" rx="12" fill="url(#spTrail)"/>
          <path class="sp-flame" d="M86 222 Q100 300 114 222 Z" fill="url(#spFlame)"/>
          <path class="sp-flame sp-flame-core" d="M93 222 Q100 262 107 222 Z" fill="#ffffff"/>
          <path d="M72 186 L44 232 L44 246 L72 226 Z" fill="#2f5670" stroke="#8cc8f2" stroke-width="3" stroke-linejoin="round"/>
          <path d="M128 186 L156 232 L156 246 L128 226 Z" fill="#2f5670" stroke="#8cc8f2" stroke-width="3" stroke-linejoin="round"/>
          <path d="M86 222 L114 222 L110 232 L90 232 Z" fill="#6b7178"/>
          <path d="M100 52 C120 74 128 104 128 136 L128 222 L72 222 L72 136 C72 104 80 74 100 52 Z" fill="url(#spBody)" stroke="#0b0d10" stroke-width="2"/>
          <path d="M100 52 C112 65 119 80 123 96 L77 96 C81 80 88 65 100 52 Z" fill="#8cc8f2"/>
          <circle cx="100" cy="134" r="15" fill="#0b1218" stroke="#2f5670" stroke-width="6"/>
          <circle cx="95" cy="129" r="4" fill="#8cc8f2" opacity=".8"/>
          <path d="M100 182 L100 222" stroke="#2f5670" stroke-width="10"/>
          <text x="100" y="178" text-anchor="middle" font-family="Rajdhani, system-ui, sans-serif" font-weight="700" font-size="20" fill="#0b0d10">F3</text>
        </g>
      </svg>
      <svg class="sp-svg" viewBox="0 0 200 320" aria-hidden="true">
        <!-- smoke -->
        <g class="sp-smoke" fill="#4a5058">
          <circle cx="78" cy="262" r="14"/><circle cx="122" cy="262" r="14"/>
          <circle cx="60" cy="266" r="11"/><circle cx="140" cy="266" r="11"/>
          <circle cx="100" cy="268" r="16"/>
        </g>
      </svg>
    </div>
    <div class="sp-title">
      <div class="sp-name" id="splash-name">F3</div>
      <div class="sp-sub">Q Planner</div>
    </div>
  </div>
  <script>
    (function () {
      var s = document.getElementById("splash");
      var start = Date.now();
      var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      var MIN = reduce ? 500 : 2300;
      try {
        var st = JSON.parse(localStorage.getItem("f3qp:settings") || "{}");
        if (st.regionName) document.getElementById("splash-name").textContent = st.regionName;
      } catch (e) {}
      function done() {
        if (!s || s.getAttribute("data-gone")) return;
        s.setAttribute("data-gone", "1");
        s.className += " splash-out";
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 450);
      }
      window.addEventListener("load", function () { setTimeout(done, Math.max(0, MIN - (Date.now() - start))); });
      s.addEventListener("click", done);
      setTimeout(done, 7000); // never block the app if something fails to load
    })();
  </script>
  <main id="app" class="app"></main>
  <noscript><p style="padding:20px">This app needs JavaScript turned on.</p></noscript>
  <script src="data/program.js"></script>
  <script src="data/library.js"></script>
  <script src="app.js"></script>
</body>
</html>
